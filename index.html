<!DOCTYPE html>
<html lang="hu-HU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="loginDiv">
        <input type="email" id="emailInput">
        <input type="password" id="pwdInput">
        <input type="button" id="signinBtn" value="Bejelentkezés">
        <input type="button" id="signupBtn" value="Regisztráció">
        <script type="module" src="./script.js"></script>
    </div>
    <div id="lobby0Div">
        <h2 id="emailh2">Email: </h2>
        <input type="number" name="lobbyId" id="lobbyIdInput" min="0" max="9999" placeholder="Szoba szám">
        <input type="number" name="lobbyPIN" id="lobbyPINInput" min="0" max="9999" placeholder="Szoba kód">
        <input type="text" name="lobbyNickname" id="lobbyNicknameInput" placeholder="Felhasználónév">
        <input type="button" id="createBtn" value="Létrehozás">
        <input type="button" id="joinBtn" value="Csatlakozás">
        <input type="button" id="logoutBtn" value="Kijelentkezés">
    </div>
    <div id="lobby1hostDiv">
        <h1>Üdvözöllek a szobában!</h1>
        <h2 id="LobbyIdhosth2">LobbyId: </h2>
        <h3>Játékosok:</h3>
        <ul id="playersListhostul"></ul>
        <input type="button" value="Indítás">
    </div>
    <div id="lobby1playerDiv">
        <h1>Üdvözöllek a szobában!</h1>
        <h2 id="LobbyIdplayerh2">LobbyId: </h2>
        <h3>Játékosok:</h3>
        <ul id="playersListplayerul"></ul>
    </div>
</body>
</html>
